<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail Flight Recorder</title>
  <style>
    :root {
      color-scheme: light;
      background: #17242a;
    }

    html,
    body,
    #dashboard-root {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #17242a;
    }

    :focus-visible {
      outline: 3px solid #c7473a;
      outline-offset: 3px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@js-joda/core": "/assets/js-joda.esm.js"
      }
    }
  </script>
</head>
<body>
  <main id="dashboard-root" aria-label="Mail Flight Recorder"></main>
  <noscript>This local mail debug dashboard requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="{{DASHBOARD_WEB_ENTRY}}"></script>
</body>
</html>
