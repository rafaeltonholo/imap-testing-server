services:
  dovecot:
    ports: !override
      - "127.0.0.1:1993:31993"
      - "127.0.0.1:21995:31995"
    volumes: !override
      - ./config:/etc/dovecot/conf.d:ro
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/dovecot
        target: /etc/dovecot/runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/ssl
        target: /etc/dovecot/ssl
        read_only: true
        bind:
          create_host_path: false
      - task5-proof-vmail:/srv/vmail
      - task5-proof-logs:/var/log/dovecot

  dovecot-operator:
    profiles: !override []
    ports: !override []
    volumes: !override
      - ./config/operator/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./config/operator/healthcheck.sh:/usr/local/bin/operator-healthcheck:ro
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/dovecot
        target: /etc/dovecot/runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/dovecot-operator
        target: /etc/dovecot/operator-auth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/ssl
        target: /etc/dovecot/ssl
        read_only: true
        bind:
          create_host_path: false
      - task5-proof-vmail:/srv/vmail

  postfix:
    ports: !override
      - "127.0.0.1:21025:25"
    volumes: !override
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/ssl
        target: /etc/postfix/ssl
        read_only: true
        bind:
          create_host_path: false

  oauth2-mock:
    ports: !override
      - "127.0.0.1:28080:8080"
    extra_hosts: !override
      - "task6-host-gateway:host-gateway"
    volumes: !override
      - type: bind
        source: ./debug-dashboard/.runtime/task5-proof/dovecot
        target: /etc/dovecot/runtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./debug-dashboard/dashboard-server/testResources/dovecot-gate0c/network-isolation-check.py
        target: /proof/network-isolation-check.py
        read_only: true
        bind:
          create_host_path: false

  stalwart:
    profiles:
      - task5-stalwart-disabled

volumes:
  task5-proof-vmail:
  task5-proof-logs:
