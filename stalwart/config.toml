# Stalwart JMAP Server — local development configuration
#
# Serves JMAP over HTTP only (no IMAP/SMTP — handled by Dovecot/Postfix).
#
# Authentication:
#   - OAuth2 Bearer: validated via oauth2-mock introspection (OIDC directory)
#     Use tokens from oauth2-mock (e.g. "valid-dev@local.test") or the full
#     OAuth2 authorization code flow at http://localhost:8080
#   - Stalwart's built-in OAuth2: device code flow and authorization code flow
#     still work at http://localhost:8443/auth/device
#   - Admin: Basic auth via authentication.fallback-admin (admin/secret)
#
# Note: Basic auth for regular users is NOT available when using an OIDC
# directory. Users must authenticate with Bearer tokens. Admin access uses
# the fallback-admin setting which bypasses the directory.

# ── Server ────────────────────────────────────────────────────────────────────

[server]
hostname = "localhost"

[server.listener."http"]
bind = ["[::]:8443"]
protocol = "http"

# ── Storage (RocksDB, embedded) ───────────────────────────────────────────────

[store."rocksdb"]
type = "rocksdb"
path = "/opt/stalwart/data"
compression = "lz4"

[storage]
data = "rocksdb"
fts = "rocksdb"
blob = "rocksdb"
lookup = "rocksdb"
directory = "oauth2-mock"

# ── OIDC Directory (validates Bearer tokens via oauth2-mock introspection) ────

[directory."oauth2-mock"]
type = "oidc"
timeout = "5s"
endpoint.url = "http://oauth2-mock:8080/introspect"
endpoint.method = "introspect"
auth.method = "none"
fields.email = "email"
fields.username = "username"

# ── Admin ─────────────────────────────────────────────────────────────────────

[authentication.fallback-admin]
user = "admin"
secret = "%{env:ADMIN_SECRET}%"
