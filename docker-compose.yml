services:
  dovecot:
    image: dovecot/dovecot:latest
    container_name: dovecot-dev
    restart: unless-stopped
    ports:
      - "143:31143"   # map container's IMAP (STARTTLS) to localhost:143
      - "993:31993"   # map container's IMAPS (TLS)   to localhost:993
    volumes:
      - ./config:/etc/dovecot/conf.d:ro
      - ./ssl:/etc/dovecot/ssl:ro
      - ./vmail:/srv/vmail
      - ./logs:/var/log/dovecot
    depends_on:
      oauth2-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postfix:
    build: ./postfix
    container_name: postfix-dev
    restart: unless-stopped
    ports:
      - "1025:25"     # SMTP (maps host:1025 → container:25)
      - "587:587"     # SMTP Submission
    depends_on:
      dovecot:
        condition: service_healthy

  oauth2-mock:
    build: ./oauth2-mock
    container_name: oauth2-mock
    restart: unless-stopped
    ports:
      - "8080:8080"   # OAuth2 introspection endpoint
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart-dev
    restart: unless-stopped
    ports:
      - "8443:8080"   # JMAP HTTP → localhost:8443
    volumes:
      - ./stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
      - ./stalwart-data:/opt/stalwart/data
    environment:
      - ADMIN_SECRET=secret
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
