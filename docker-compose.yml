services:
  dovecot:
    image: dovecot/dovecot:2.4.4@sha256:723e3392fe16c6fad8ddc605ea767cc01b4bad9cd9f13eb1dbac15e79c89b2d4
    restart: unless-stopped
    ports:
      # Standard ports are intentionally LAN-accessible for physical test devices.
      - "0.0.0.0:143:31143"       # IMAP (STARTTLS)
      - "0.0.0.0:993:31993"       # IMAPS (TLS)
      - "0.0.0.0:110:31110"       # POP3 (STARTTLS)
      - "0.0.0.0:995:31995"       # POP3S (TLS)
      # Stable loopback aliases are used by the dashboard and host-side probes.
      - "127.0.0.1:1143:31143"   # IMAP (STARTTLS)
      - "127.0.0.1:1993:31993"   # IMAPS (TLS)
      - "127.0.0.1:1110:31110"   # POP3 (STARTTLS)
      - "127.0.0.1:1995:31995"   # POP3S (TLS; image listens on 31995)
    volumes:
      - ./config:/etc/dovecot/conf.d:ro
      - ./ssl:/etc/dovecot/ssl:ro
      - ./vmail:/srv/vmail
      - ./logs:/var/log/dovecot
    depends_on:
      oauth2-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dovecot-operator:
    profiles:
      - dovecot-operator
    image: dovecot/dovecot:2.4.4@sha256:723e3392fe16c6fad8ddc605ea767cc01b4bad9cd9f13eb1dbac15e79c89b2d4
    restart: unless-stopped
    volumes:
      - ./config/operator/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./config/operator/healthcheck.sh:/usr/local/bin/operator-healthcheck:ro
      - ./debug-dashboard/.runtime/dovecot:/etc/dovecot/runtime:ro
      - type: bind
        source: ./debug-dashboard/.runtime/dovecot-operator
        target: /etc/dovecot/operator-auth
        read_only: true
        bind:
          create_host_path: false
      - ./ssl:/etc/dovecot/ssl:ro
      - ./vmail:/srv/vmail
    networks:
      - operator-ingress
    healthcheck:
      test: ["CMD", "/usr/local/bin/operator-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postfix:
    build: ./postfix
    restart: unless-stopped
    ports:
      # LAN-facing submission ports let physical test devices use this provider.
      - "0.0.0.0:1025:25"       # SMTP
      - "0.0.0.0:465:465"       # SMTPS (implicit TLS)
      - "0.0.0.0:587:587"       # SMTP Submission
      # Stable loopback aliases are used by dashboard authentication probes.
      - "127.0.0.1:1465:465"    # SMTPS (implicit TLS)
      - "127.0.0.1:1587:587"    # SMTP Submission
    volumes:
      - ./ssl:/etc/postfix/ssl:ro
    depends_on:
      dovecot:
        condition: service_healthy
      oauth2-mock:
        condition: service_healthy

  oauth2-mock:
    build: ./oauth2-mock
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # OAuth2 introspection endpoint
    volumes:
      - ./config:/etc/mail-sandbox-config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=1).close(); request=b'eligible healthcheck@invalid'; connection=socket.create_connection(('127.0.0.1', 10001), 1); connection.settimeout(1); connection.sendall(str(len(request)).encode('ascii')+b':'+request+b','); stream=connection.makefile('rb'); response=stream.read(12); stream.close(); connection.close(); assert response == b'9:NOTFOUND ,'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  stalwart:
    image: stalwartlabs/stalwart:v0.15@sha256:dcf575db2d53d9ef86d6ced8abe4ba491984659a0f8862cc6079ee7b41c3c568
    restart: unless-stopped
    ports:
      - "8443:8443"   # JMAP HTTP
    volumes:
      - ./stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
      - ./stalwart-data:/opt/stalwart/data
    environment:
      - ADMIN_SECRET=secret
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8443"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  operator-ingress:
    driver: bridge
    internal: true
