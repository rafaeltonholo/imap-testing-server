services:
  dovecot:
    image: dovecot/dovecot:2.4.1@sha256:1296e0f1029cdd95e6849fb82f5d142a6e2a46218451773316cea678de75254b
    restart: unless-stopped
    ports:
      - "127.0.0.1:1143:31143"   # IMAP (STARTTLS)
      - "127.0.0.1:1993:31993"   # IMAPS (TLS)
      - "127.0.0.1:1110:31110"   # POP3 (STARTTLS)
      - "127.0.0.1:1995:31990"   # POP3S (TLS; image listens on 31990)
    volumes:
      - ./config:/etc/dovecot/conf.d:ro
      - ./debug-dashboard/.runtime/dovecot:/etc/dovecot/runtime:ro
      - ./ssl:/etc/dovecot/ssl:ro
      - ./vmail:/srv/vmail
      - ./logs:/var/log/dovecot
    depends_on:
      oauth2-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postfix:
    build: ./postfix
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:25"     # SMTP
      - "127.0.0.1:1465:465"    # SMTPS (implicit TLS)
      - "127.0.0.1:1587:587"    # SMTP Submission
    volumes:
      - ./ssl:/etc/postfix/ssl:ro
    depends_on:
      dovecot:
        condition: service_healthy
      oauth2-mock:
        condition: service_healthy

  oauth2-mock:
    build: ./oauth2-mock
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # OAuth2 introspection endpoint
    volumes:
      - ./debug-dashboard/.runtime/dovecot:/etc/dovecot/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=1).close(); request=b'eligible healthcheck@invalid'; connection=socket.create_connection(('127.0.0.1', 10001), 1); connection.settimeout(1); connection.sendall(str(len(request)).encode('ascii')+b':'+request+b','); stream=connection.makefile('rb'); response=stream.read(12); stream.close(); connection.close(); assert response == b'9:NOTFOUND ,'"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  stalwart:
    image: stalwartlabs/stalwart:latest
    restart: unless-stopped
    ports:
      - "8443:8443"   # JMAP HTTP
    volumes:
      - ./stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
      - ./stalwart-data:/opt/stalwart/data
    environment:
      - ADMIN_SECRET=secret
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8443"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
