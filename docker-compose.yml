services:
  dovecot:
    image: dovecot/dovecot:latest
    container_name: dovecot-dev
    restart: unless-stopped
    ports:
      - "143:31143"   # map container's IMAP (STARTTLS) to localhost:143
      - "993:31993"   # map container's IMAPS (TLS)   to localhost:993
    volumes:
      - ./config:/etc/dovecot/conf.d:ro
      - ./ssl:/etc/dovecot/ssl:ro
      - ./vmail:/srv/vmail
      - ./logs:/var/log/dovecot
    healthcheck:
      test: ["CMD", "doveadm", "who"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postfix:
    build: ./postfix
    container_name: postfix-dev
    restart: unless-stopped
    ports:
      - "1025:25"     # SMTP (maps host:1025 → container:25)
      - "587:587"     # SMTP Submission
    depends_on:
      dovecot:
        condition: service_healthy
