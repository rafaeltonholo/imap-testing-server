dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot
state_dir = /run/dovecot
default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

protocols = imap
auth_mechanisms = login
auth_allow_cleartext = no
auth_master_user_separator = *
auth_username_format = %{user}
auth_failure_delay = 0s

passdb operator-master {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/operator-auth/master-users
  master = yes
  result_success = continue
}

passdb deny-direct {
  driver = static
  deny = yes
  skip = authenticated
  fields {
    nopassword = yes
    nodelay = yes
  }
}

passdb eligible-target {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/runtime/users
  skip = unauthenticated
  result_failure = continue-fail
  result_internalfail = return-fail
}

passdb deny-missing {
  driver = static
  deny = yes
  fields {
    nopassword = yes
    nodelay = yes
  }
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/runtime/users
  fields {
    uid:default = 1000
    gid:default = 1000
    home:default = /srv/vmail/%{user}
  }
}

mail_home = /srv/vmail/%{user}
mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_layout = index
mailbox_list_utf8 = yes
mail_utf8_extensions = yes
mail_uid = vmail
mail_gid = vmail

namespace inbox {
  name = inbox
  type = private
  inbox = yes
  prefix = INBOX.
  separator = .
  namespace_list = yes
  subscriptions = yes

  mailbox Drafts {
    auto = create
    special_use = \Drafts
  }
  mailbox Sent {
    auto = create
    special_use = \Sent
  }
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
}

ssl = yes
ssl_server_cert_file = /etc/dovecot/ssl/tls.crt
ssl_server_key_file = /etc/dovecot/ssl/tls.key

service imap-login {
  chroot =
  process_min_avail = 1
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    default_internal_group = vmail
    default_internal_user = vmail
    default_login_user = vmail
    listen = 127.0.0.1
    port = 31993
    ssl = yes
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
auth_debug = yes
auth_verbose = yes
auth_verbose_passwords = no
mail_debug = yes
