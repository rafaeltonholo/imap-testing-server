# Announce a classic INBOX.* prefix, with "." as the hierarchy separator.
# Clients that support RFC 2342 NAMESPACE will auto-discover this.
# Dovecot 2.4 namespace (private) that advertises IMAP prefix "INBOX."
namespace inbox {
  name = inbox
  type = private
  inbox = yes
  prefix = INBOX.
  separator = .
  namespace_list = yes     # was: children
  subscriptions = yes

  mailbox Drafts {
    auto = create
    special_use = \Drafts
  }
  mailbox Sent {
    auto = create
    special_use = \Sent
  }
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
}
