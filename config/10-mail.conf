# config/10-mail.conf  (Dovecot 2.4+)
mail_home   = /srv/vmail/%{user}
mail_driver = maildir
mail_path   = ~/Maildir
# (optional) If you want folder names as real subdirs instead of Maildir++ dots:
# mailbox_list_layout = fs
# (optional) If INBOX lives elsewhere, you can point it explicitly:
# mail_inbox_path = ~/Maildir/.INBOX.
