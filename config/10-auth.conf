# config/10-auth.conf
auth_mechanisms = plain login
auth_allow_cleartext = yes   # ok for LOCAL dev + TLS

# PASSDB: passwd-file (2.4 syntax)
passdb passwd-file {
  # Path to your users file (one user per line, see below)
  passwd_file_path = /etc/dovecot/conf.d/users
  # Optional if you prefix each password with {SCHEME} in users file.
  # default_password_scheme = sha256-crypt
}

# USERDB: single UID/GID with templated home
userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user}
  }
}
